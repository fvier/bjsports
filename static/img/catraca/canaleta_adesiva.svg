<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" rx="16" fill="url(#bgCan)"/>
  <!-- PVC Trunking Body -->
  <polygon points="40,110 230,60 260,75 70,125" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <polygon points="70,125 260,75 260,95 70,145" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Red Adhesive Strip Base -->
  <polygon points="40,113 230,63 230,67 40,117" fill="#dc2626"/>
  <!-- Separated Lid Piece -->
  <polygon points="50,70 240,20 265,30 75,80" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Label Badge -->
  <rect x="20" y="20" width="165" height="30" rx="8" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1"/>
  <text x="102" y="40" fill="#7dd3fc" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">CANALETA ADESIVA (20x10mm)</text>
</svg>
