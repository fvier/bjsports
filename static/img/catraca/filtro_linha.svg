<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFiltro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" rx="16" fill="url(#bgFiltro)"/>
  <!-- Power Strip Body -->
  <rect x="40" y="80" width="220" height="55" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <!-- Power Switch (Red) -->
  <rect x="52" y="93" width="22" height="28" rx="4" fill="#dc2626"/>
  <rect x="55" y="96" width="16" height="10" rx="2" fill="#fca5a5"/>
  <!-- Outlets (4 Sockets) -->
  <g fill="#0f172a" stroke="#64748b" stroke-width="1.5">
    <circle cx="105" cy="102" r="5"/>
    <circle cx="105" cy="113" r="5"/>
    <circle cx="120" cy="107.5" r="5"/>

    <circle cx="145" cy="102" r="5"/>
    <circle cx="145" cy="113" r="5"/>
    <circle cx="160" cy="107.5" r="5"/>

    <circle cx="185" cy="102" r="5"/>
    <circle cx="185" cy="113" r="5"/>
    <circle cx="200" cy="107.5" r="5"/>

    <circle cx="225" cy="102" r="5"/>
    <circle cx="225" cy="113" r="5"/>
    <circle cx="240" cy="107.5" r="5"/>
  </g>
  <!-- Cable Out -->
  <path d="M 40 107.5 L 15 107.5" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <!-- Label Badge -->
  <rect x="20" y="20" width="150" height="30" rx="8" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1"/>
  <text x="95" y="40" fill="#fca5a5" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">FILTRO DE LINHA (4-6T)</text>
</svg>
