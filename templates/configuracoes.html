{% set erp_page = true %}
{% extends "base.html" %}

{% block content %}
  <!-- ÁREA DE CONFIGURAÇÕES COM BARRA LATERAL ERP COMERCIAL -->
  <div class="erp-wrapper">
    
    <!-- BARRA LATERAL ORGANIZADA NAS 3 SEÇÕES: AULAS, FINANCEIRO, ADMINISTRAÇÃO -->
{% include "_erp_sidebar.html" %}

    <!-- ÁREA PRINCIPAL -->
    <div class="erp-main-container">
      <header class="erp-topbar">
        <div class="erp-topbar-left">
          <button class="erp-hamburger-toggle" id="erpHambergerBtn" title="Alternar Menu">
            <i data-lucide="menu"></i>
          </button>
          <span class="erp-blue-badge">BJ Sports ERP • Configurações</span>
        </div>
        
        <div class="erp-topbar-right">
          <div class="erp-user-badge">
            <span class="erp-avatar">🥋</span>
            <span class="erp-user-name">{{ user_name }}</span>
          </div>
        </div>
      </header>

      <main class="erp-content">
        <div class="erp-hero-banner" style="margin-bottom: 28px;">
          <div class="erp-status-indicator">
            <span class="live-dot"></span> PERFIL E PREFERÊNCIAS DO ALUNO
          </div>
          <h1 class="erp-hero-heading">Configurações de Perfil</h1>
          <p class="erp-hero-sub">Atualize seus dados pessoais e dados de contato.</p>
        </div>

        <div class="glass-panel" style="max-width: 650px; background: rgba(18, 18, 28, 0.95); border: 1px solid var(--border-light);">
          <h3 style="font-family: var(--font-heading); font-size: 1.3rem; font-weight: 800; margin-bottom: 20px;">
            <i data-lucide="user" class="icon-gold"></i> Dados Cadastrais
          </h3>

          <form action="{{ url_for('configuracoes') }}" method="POST" class="modal-form">
            <div class="form-group">
              <label>Nome Completo</label>
              <input type="text" name="name" value="{{ user_name }}" required>
            </div>

            <div class="form-group">
              <label>Nome de Usuário (Login)</label>
              <input type="text" value="@{{ username }}" disabled style="opacity: 0.7;">
            </div>

            <div class="form-group">
              <label>WhatsApp / Telefone</label>
              <input type="tel" name="phone" value="({{ profile_user.ddd }}) {{ profile_user.phone }}" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Faixa no Jiu-Jitsu</label>
                <select name="belt_color">
                  {% for color, label in [('branca','Branca'),('azul','Azul'),('roxa','Roxa'),('marrom','Marrom'),('preta','Preta')] %}
                  <option value="{{ color }}" {% if profile_user.belt_color == color %}selected{% endif %}>Faixa {{ label }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="form-group">
                <label>Grau atual</label>
                <select name="belt_degree">
                  {% for degree in range(0, 5) %}<option value="{{ degree }}" {% if profile_user.belt_degree == degree %}selected{% endif %}>{{ degree }}º grau</option>{% endfor %}
                </select>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-glow">
              <i data-lucide="save"></i> Salvar Alterações no Perfil
            </button>
          </form>
        </div>

      </main>
    </div>
  </div>
{% endblock %}
