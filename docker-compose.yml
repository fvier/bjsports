version: '3.8'

services:
  bjsports-app:
    build: .
    container_name: bjsports-app
    restart: always
    ports:
      - "5050:5050"
    volumes:
      - bjsports_data:/app/instance
    environment:
      - PORT=5050
      - HOST=0.0.0.0
      - SECRET_KEY=bjsports-production-secret-key-2026-cajazeiras
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # Middlewares: HTTPS Redirect (only for domain)
      - "traefik.http.middlewares.bjsports-https.redirectscheme.scheme=https"
      # Router 1: Apex Domain bjsports.com.br (HTTP -> HTTPS)
      - "traefik.http.routers.bjsports-http.entrypoints=http"
      - "traefik.http.routers.bjsports-http.middlewares=bjsports-https"
      - "traefik.http.routers.bjsports-http.rule=Host(`bjsports.com.br`)"
      # Router 2: Apex Domain bjsports.com.br (HTTPS SSL)
      - "traefik.http.routers.bjsports.entrypoints=https"
      - "traefik.http.routers.bjsports.rule=Host(`bjsports.com.br`)"
      - "traefik.http.routers.bjsports.tls=true"
      - "traefik.http.routers.bjsports.tls.certresolver=letsencrypt"
      # Router 3: Subdomain www.bjsports.com.br (HTTP -> HTTPS)
      - "traefik.http.routers.bjsports-www-http.entrypoints=http"
      - "traefik.http.routers.bjsports-www-http.middlewares=bjsports-https"
      - "traefik.http.routers.bjsports-www-http.rule=Host(`www.bjsports.com.br`)"
      # Router 4: Subdomain www.bjsports.com.br (HTTPS SSL Independent)
      - "traefik.http.routers.bjsports-www.entrypoints=https"
      - "traefik.http.routers.bjsports-www.rule=Host(`www.bjsports.com.br`)"
      - "traefik.http.routers.bjsports-www.tls=true"
      - "traefik.http.routers.bjsports-www.tls.certresolver=letsencrypt"
      # Router 5: Direct IP access http://147.79.110.132 (Port 80 HTTP directly - NO HTTPS REDIRECT)
      - "traefik.http.routers.bjsports-ip.entrypoints=http"
      - "traefik.http.routers.bjsports-ip.rule=Host(`147.79.110.132`)"
      - "traefik.http.routers.bjsports-ip.service=bjsports"
      # Service LoadBalancer Port
      - "traefik.http.services.bjsports.loadbalancer.server.port=5050"
    networks:
      - coolify

volumes:
  bjsports_data:

networks:
  coolify:
    external: true
